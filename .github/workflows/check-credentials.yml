name: Check credentials

# Run by hand (Actions > Check credentials > Run workflow) after adding or rotating a secret.
# It proves, without printing anything secret, that:
# - SOURCE_DEPLOY_KEY can read the private source repository, and can't push to it;
# - TAURI_SIGNING_PRIVATE_KEY with TAURI_SIGNING_PRIVATE_KEY_PASSWORD signs, and the signature
#   verifies against the updater public key in the source's tauri.conf.json, which is the key
#   installed apps check updates with.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: SaqibZafar/yogurtsql

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: The secrets are set
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in SOURCE_DEPLOY_KEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret isn't set."
              missing=1
            else
              echo "$name is set."
            fi
          done
          exit "$missing"

      - name: The deploy key is a usable SSH key
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: |
          set -uo pipefail
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          if printf '%s' "$SOURCE_DEPLOY_KEY" | grep -q $'\r'; then
            echo "::error::SOURCE_DEPLOY_KEY has Windows line endings (CRLF), which ssh can't read. Set it again from a file with LF line endings."
            bad=1
          fi
          printf '%s\n' "$SOURCE_DEPLOY_KEY" | tr -d '\r' > "$dir/key"
          chmod 600 "$dir/key"
          echo "The key is $(wc -l < "$dir/key") lines long."
          if ! head -n1 "$dir/key" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            echo "::error::SOURCE_DEPLOY_KEY isn't an OpenSSH private key. It should be the file without .pub."
            exit 1
          fi
          if ! ssh-keygen -y -P "" -f "$dir/key" > "$dir/key.pub" 2> "$dir/err"; then
            echo "::error::ssh-keygen can't read SOURCE_DEPLOY_KEY without a passphrase: $(cat "$dir/err"). Make a new key with an empty passphrase."
            exit 1
          fi
          # The fingerprint is public. Compare it with the deploy key in the source repository's settings.
          echo "Deploy key fingerprint: $(ssh-keygen -lf "$dir/key.pub")"
          exit "${bad:-0}"

      - name: Read the private source with the deploy key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: master
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - name: The source's updater reads this repository
        run: |
          set -euo pipefail
          endpoint=$(node -p "require('./source/src-tauri/tauri.conf.json').plugins.updater.endpoints[0]")
          echo "Source commit $(git -C source rev-parse --short HEAD); updater feed $endpoint"
          if [ "$endpoint" != "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" ]; then
            echo "::error::The source's updater reads $endpoint, not this repository's feed."
            exit 1
          fi

      - name: The deploy key can't push
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: |
          set -uo pipefail
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$SOURCE_DEPLOY_KEY" > "$dir/key"
          chmod 600 "$dir/key"
          # GitHub's SSH host keys, from its API over HTTPS, so the host is authenticated.
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$dir/known_hosts"
          # A dry run pushes nothing, but GitHub still checks write access when it starts.
          out=$(git -C source push --dry-run "git@github.com:${SOURCE_REPO}.git" HEAD:refs/heads/credential-check-never-pushed 2>&1)
          status=$?
          echo "$out" | grep -v -i "warning: permanently added"
          if [ "$status" -eq 0 ]; then
            echo "::error::The deploy key has write access to ${SOURCE_REPO}. Replace it with a read-only key."
            exit 1
          fi
          if ! echo "$out" | grep -qi "read only\|read-only\|denied\|not allowed"; then
            echo "::error::The push failed, but not because the key is read-only. See the output above."
            exit 1
          fi
          echo "The deploy key is read-only."

      - name: The signing key signs updates the app accepts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          echo "credential check ${GITHUB_RUN_ID}" > "$dir/probe.txt"
          cli=$(node -p "require('./source/package.json').devDependencies['@tauri-apps/cli'].replace(/^[^0-9]*/, '')")
          npx --yes "@tauri-apps/cli@$cli" signer sign "$dir/probe.txt" > /dev/null
          cat > "$dir/verify.mjs" <<'EOF'
          // Checks a minisign signature the way the Tauri updater does.
          import { createHash, createPublicKey, verify } from "node:crypto";
          import { readFileSync } from "node:fs";
          const [file, confPath] = process.argv.slice(2);
          const lines = (b64) => Buffer.from(b64.trim(), "base64").toString("utf8").split(/\r?\n/).filter(Boolean);
          const conf = JSON.parse(readFileSync(confPath, "utf8"));
          const pk = Buffer.from(lines(conf.plugins.updater.pubkey)[1], "base64");
          const key = createPublicKey({ key: Buffer.concat([Buffer.from("302a300506032b6570032100", "hex"), pk.subarray(10)]), format: "der", type: "spki" });
          const s = lines(readFileSync(`${file}.sig`, "utf8"));
          const sig = Buffer.from(s[1], "base64");
          const trusted = s[2].replace(/^trusted comment: /, "");
          const data = readFileSync(file);
          const message = sig.subarray(0, 2).toString() === "ED" ? createHash("blake2b512").update(data).digest() : data;
          const problems = [];
          if (!sig.subarray(2, 10).equals(pk.subarray(2, 10))) problems.push("it was made with a different key than the app trusts");
          else if (!verify(null, message, key, sig.subarray(10))) problems.push("the signature doesn't verify");
          else if (!verify(null, Buffer.concat([sig.subarray(10), Buffer.from(trusted)]), key, Buffer.from(s[3], "base64"))) problems.push("the trusted comment doesn't verify");
          if (problems.length) {
            console.log(`::error::The signing key doesn't produce valid update signatures: ${problems.join("; ")}.`);
            process.exit(1);
          }
          console.log(`Signed with key ${pk.subarray(2, 10).reverse().toString("hex").toUpperCase()}, which the app trusts.`);
          EOF
          node "$dir/verify.mjs" "$dir/probe.txt" source/src-tauri/tauri.conf.json
          rm -rf "$dir"
