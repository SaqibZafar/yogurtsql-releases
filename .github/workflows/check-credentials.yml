name: Check credentials

# Run by hand (Actions > Check credentials > Run workflow) after adding or rotating a secret.
# It proves, without printing anything secret, that:
# - SOURCE_DEPLOY_KEY (environment "source") can read the private source repository, and can't
#   push to it;
# - UPDATER_SIGNING_KEY with UPDATER_SIGNING_KEY_PASSWORD (environment "release",
#   which asks a maintainer to approve) sign with .github/scripts/sign-updates.mjs, exactly as
#   releases are signed, and the signature verifies against the updater public key in the
#   source's tauri.conf.json, which is the key installed apps check updates with.
on:
  workflow_dispatch:

permissions: {}

env:
  SOURCE_REPO: SaqibZafar/yogurtsql

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: source
    permissions:
      contents: read
    outputs:
      pubkey: ${{ steps.feeds.outputs.pubkey }}
    steps:
      - name: The deploy key is set
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: |
          if [ -z "$SOURCE_DEPLOY_KEY" ]; then
            echo "::error::The SOURCE_DEPLOY_KEY secret isn't set in the source environment."
            exit 1
          fi
          echo "SOURCE_DEPLOY_KEY is set."

      - name: The deploy key is a usable SSH key
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: |
          set -uo pipefail
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          if printf '%s' "$SOURCE_DEPLOY_KEY" | grep -q $'\r'; then
            echo "::error::SOURCE_DEPLOY_KEY has Windows line endings (CRLF), which ssh can't read. Set it again from a file with LF line endings."
            bad=1
          fi
          printf '%s\n' "$SOURCE_DEPLOY_KEY" | tr -d '\r' > "$dir/key"
          chmod 600 "$dir/key"
          echo "The key is $(wc -l < "$dir/key") lines long."
          if ! head -n1 "$dir/key" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            echo "::error::SOURCE_DEPLOY_KEY isn't an OpenSSH private key. It should be the file without .pub."
            exit 1
          fi
          if ! ssh-keygen -y -P "" -f "$dir/key" > "$dir/key.pub" 2> "$dir/err"; then
            echo "::error::ssh-keygen can't read SOURCE_DEPLOY_KEY without a passphrase: $(cat "$dir/err"). Make a new key with an empty passphrase."
            exit 1
          fi
          # The fingerprint is public. Compare it with the deploy key in the source repository's settings.
          echo "Deploy key fingerprint: $(ssh-keygen -lf "$dir/key.pub")"
          exit "${bad:-0}"

      - name: Read the private source with the deploy key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: develop
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - name: The source's updater reads downloads.yogurtsql.com, then this repository
        id: feeds
        run: |
          set -euo pipefail
          endpoints=$(node -p "require('./source/src-tauri/tauri.conf.json').plugins.updater.endpoints.join(' ')")
          echo "Source commit $(git -C source rev-parse --short HEAD); updater feeds: $endpoints"
          want="https://downloads.yogurtsql.com/latest.json https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          if [ "$endpoints" != "$want" ]; then
            echo "::error::The source's updater reads \"$endpoints\", not \"$want\"."
            exit 1
          fi
          echo "pubkey=$(node -p "require('./source/src-tauri/tauri.conf.json').plugins.updater.pubkey")" >> "$GITHUB_OUTPUT"

      - name: The deploy key can't push
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: |
          set -uo pipefail
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$SOURCE_DEPLOY_KEY" > "$dir/key"
          chmod 600 "$dir/key"
          # GitHub's SSH host keys, from its API over HTTPS, so the host is authenticated.
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$dir/known_hosts"
          # A dry run pushes nothing, but GitHub still checks write access when it starts.
          # Steps run with bash -e, so catch the expected failure instead of stopping on it.
          status=0
          out=$(git -C source push --dry-run "git@github.com:${SOURCE_REPO}.git" HEAD:refs/heads/credential-check-never-pushed 2>&1) || status=$?
          echo "$out" | grep -v -i "warning: permanently added" || true
          if [ "$status" -eq 0 ]; then
            echo "::error::The deploy key has write access to ${SOURCE_REPO}. Replace it with a read-only key."
            exit 1
          fi
          if ! echo "$out" | grep -qi "read only\|read-only\|denied\|not allowed"; then
            echo "::error::The push failed, but not because the key is read-only. See the output above."
            exit 1
          fi
          echo "The deploy key is read-only."

  signing:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The signing key signs updates the app accepts
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
          UPDATER_SIGNING_KEY_PASSWORD: ${{ secrets.UPDATER_SIGNING_KEY_PASSWORD }}
          TRUSTED_PUBKEY: ${{ needs.source.outputs.pubkey }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          echo "credential check ${GITHUB_RUN_ID}" > "$dir/probe.txt"
          node .github/scripts/sign-updates.mjs 0.0.0 "$dir/probe.txt"
          PUBKEY="$TRUSTED_PUBKEY" node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ plugins: { updater: { pubkey: process.env.PUBKEY } } }))' "$RUNNER_TEMP/app-key.json"
          node .github/scripts/verify-signatures.mjs "$dir" "$RUNNER_TEMP/app-key.json" 0.0.0
          rm -rf "$dir"
          echo "UPDATER_SIGNING_KEY signs updates that the app in the source's develop branch accepts."
